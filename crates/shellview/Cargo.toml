[package]
name = "shellview"
description = "A multi-pane terminal workspace: your real shell plus files, system stats, data flow and coding agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
crossterm = "0.29"
libc = "0.2"
portable-pty = "0.9"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
signal-hook = "0.3"
sv-proto = { version = "0.1.0", path = "../sv-proto" }
vt100 = "0.16"
